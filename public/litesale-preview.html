<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة طلبات LiteSale — كورفكس</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f4f5fa;color:#1d2340;margin:0;padding:16px}main{max-width:850px;margin:auto}.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 1px 10px #0001}button{background:#4536d4;color:white;border:0;border-radius:10px;padding:13px 20px;font-size:16px;cursor:pointer}button:disabled{opacity:.6}.notice{background:#f0edff;padding:12px;border-radius:10px}dl{display:grid;grid-template-columns:110px 1fr;gap:8px;margin:0}dt{color:#555}dd{margin:0;overflow-wrap:anywhere}small{color:#666}#error{color:#ae2020;white-space:pre-wrap}</style></head><body><main><div class="card"><h2>معاينة طلبات LiteSale</h2><p class="notice">عرض فقط: لا يتم إدخال أي طلب إلى كورفكس أو إرساله للطباعة. لا يوجد تحديث تلقائي؛ المعاينة تبدأ فقط عند الضغط على الزر.</p><button id="load">عرض آخر 10 طلبات</button><p id="status" aria-live="polite">لم يتم طلب البيانات بعد.</p><p id="error" role="alert"></p></div><section id="orders"></section><p><a href="/">العودة إلى كورفكس</a></p></main><script>
const btn=document.getElementById('load'),status=document.getElementById('status'),err=document.getElementById('error'),list=document.getElementById('orders');
function field(dl,label,value){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value==null||value===''?'—':typeof value==='object'?JSON.stringify(value):String(value);dl.append(dt,dd)}
btn.addEventListener('click',async()=>{btn.disabled=true;err.textContent='';list.replaceChildren();status.textContent='جارٍ قراءة الطلبات...';try{
 const token=localStorage.getItem('corvex_token');if(!token)throw Error('سجّل الدخول بحساب المدير في كورفكس أولًا.');
 const res=await fetch('/api/litesale-preview',{method:'POST',headers:{Authorization:'Bearer '+token},cache:'no-store'});const data=await res.json();
 if(!res.ok)throw Error(data.error+(data.required?' — '+data.required.join(', '):'')+(data.keys?' — '+data.keys.join(', '):''));
 status.textContent='تم عرض '+data.shown+' طلبات من LiteSale. لم يتم إدخال أي طلب في كورفكس.';
 if(!data.orders.length){list.textContent='لا توجد طلبات في النتيجة.';return}
 for(const o of data.orders){const article=document.createElement('article');article.className='card';const heading=document.createElement('h3');heading.textContent='طلب '+(o.id??'بدون رقم');const dl=document.createElement('dl');for(const [label,key] of [['العميل','name'],['الهاتف','phone'],['المنتج','product'],['المبلغ','amount'],['الحالة','status'],['التاريخ','created_at']])field(dl,label,o[key]);article.append(heading,dl);list.append(article)}
 }catch(e){status.textContent='تعذرت المعاينة.';err.textContent=e.message}finally{btn.disabled=false}});
</script></body></html>
