<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة طلبات LiteSale — كورفكس</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f4f5fa;color:#1d2340;margin:0;padding:16px}main{max-width:850px;margin:auto}.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 1px 10px #0001}button{background:#4536d4;color:white;border:0;border-radius:10px;padding:13px 20px;font-size:16px;cursor:pointer}button:disabled{opacity:.6}.notice{background:#f0edff;padding:12px;border-radius:10px}dl{display:grid;grid-template-columns:110px 1fr;gap:8px;margin:0}dt{color:#555}dd{margin:0;overflow-wrap:anywhere}small{color:#666}.muted{color:#666;font-size:14px}#error{color:#ae2020;white-space:pre-wrap}</style></head><body><main><div class="card"><h2>معاينة طلبات LiteSale</h2><p class="notice">معاينة يدوية فقط. لا يتم إدخال أو تعديل أي طلب في كورفكس، ولا إرسال شيء للطباعة. تُقرأ التفاصيل عند الضغط على الزر فقط.</p><button id="load">عرض آخر 10 طلبات بتفاصيلها</button><p id="status" aria-live="polite">لم يبدأ الفحص.</p><p id="error" role="alert"></p></div><section id="orders"></section><p><a href="/">العودة إلى كورفكس</a></p></main><script>
const btn=document.getElementById('load'),status=document.getElementById('status'),err=document.getElementById('error'),list=document.getElementById('orders');
function show(v){return v==null||v===''?'—':typeof v==='object'?JSON.stringify(v):String(v)}
function field(dl,label,value){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=show(value);dl.append(dt,dd)}
async function post(path,token,body){const res=await fetch(path,{method:'POST',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),cache:'no-store'});const data=await res.json();if(!res.ok)throw Error(data.error||'تعذر قراءة البيانات');return data}
btn.addEventListener('click',async()=>{
 btn.disabled=true;err.textContent='';list.replaceChildren();status.textContent='جارٍ جلب آخر الطلبات...';
 try{
  const token=localStorage.getItem('corvex_token');if(!token)throw Error('سجّل الدخول بحساب المدير في كورفكس أولًا.');
  const data=await post('/api/litesale-preview',token);
  if(!data.orders.length){status.textContent='لا توجد طلبات للعرض.';return}
  const jobs=[];
  for(const o of data.orders){
   const article=document.createElement('article');article.className='card';
   const heading=document.createElement('h3');heading.textContent='طلب '+show(o.id);
   const dl=document.createElement('dl');
   for(const [label,key] of [['العميل','name'],['الهاتف','phone'],['الحالة','status'],['التاريخ','created_at']])field(dl,label,o[key]);
   const detail=document.createElement('div');detail.className='muted';detail.textContent='جارٍ قراءة التفاصيل...';
   article.append(heading,dl,detail);list.append(article);
   jobs.push(async()=>{
    if(o.id==null){detail.textContent='لا يوجد رقم طلب لجلب التفاصيل.';return}
    try{
     const response=await post('/api/litesale-order-detail',token,{id:String(o.id)});const d=response.detail;
     detail.remove();const more=document.createElement('dl');
     for(const [label,key] of [['اسم المنتج / الرقم','product'],['الإجمالي','amount'],['الكمية','quantity'],['اللون','color'],['المقاس','size'],['الوزن (كغ)','weight_kg'],['المدينة','city'],['العنوان','address'],['ملاحظات','notes']])field(more,label,d[key]);
     article.append(more);
     const diagnostics=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');
     summary.textContent='تشخيص الحقول (للمدير)';pre.style.whiteSpace='pre-wrap';pre.style.overflowWrap='anywhere';
     pre.textContent=(response.diagnostic?.candidate_fields||[]).map(x=>x.path+' ['+x.type+']'+(x.value!==undefined?' = '+x.value:'')).join('\n')||'لا توجد حقول إضافية';
     diagnostics.append(summary,pre);article.append(diagnostics);
    }catch(e){detail.textContent='تعذر تحميل تفاصيل هذا الطلب: '+e.message}
   });
  }
  // Limit simultaneous requests to avoid LiteSale rate limits. No timer or polling.
  let cursor=0,done=0;const worker=async()=>{while(cursor<jobs.length){const index=cursor++;await jobs[index]();done++;status.textContent='تم عرض '+data.shown+' طلبات؛ اكتملت تفاصيل '+done+' من '+jobs.length+'. لم يتم إدخال أي طلب في كورفكس.'}};
  await Promise.all([worker(),worker()]);
 }catch(e){status.textContent='تعذرت المعاينة.';err.textContent=e.message}finally{btn.disabled=false}
});
</script></body></html>
