<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات LiteSale بانتظار الموافقة — كورفكس</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f4f5fa;color:#1d2340;margin:0;padding:14px}main{max-width:860px;margin:auto}.card{background:#fff;border-radius:15px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}h2{margin:8px 0}button,select{font:inherit;border-radius:10px;padding:10px 14px}button{border:0;background:#4437ce;color:#fff;cursor:pointer}button:disabled{opacity:.5}.danger{background:#a72e39}.approve{background:#177c57}.line{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}dl{display:grid;grid-template-columns:110px 1fr;gap:7px}dt{color:#666}dd{margin:0;overflow-wrap:anywhere}.notice{background:#efedff;padding:14px;border-radius:12px}small{color:#666}#error{color:#b02032;white-space:pre-wrap}select{max-width:100%;border:1px solid #bbb;background:white}</style></head><body><main><section class="card"><h2>طلبات LiteSale بانتظار الموافقة</h2><p class="notice">الطلبات الجديدة تُعرض هنا للمراجعة. لا يدخل أي طلب إلى كورفكس إلا بعد الضغط على «موافقة» واختيار المتجر. «حذف من القائمة» لا يحذف الطلب من LiteSale.</p><div class="line"><button id="refresh">تحديث واستقبال الطلبات</button><small>تحديث تلقائي كل دقيقة طالما الصفحة مفتوحة فقط</small></div><p id="status" aria-live="polite">جارٍ التحميل...</p><p id="error" role="alert"></p></section><div id="orders"></div><p><a href="/">العودة إلى كورفكس</a></p></main><script>
const token=localStorage.getItem('corvex_token'),list=document.getElementById('orders'),status=document.getElementById('status'),error=document.getElementById('error'),refresh=document.getElementById('refresh');
let busy=false,stores=[];
const value=v=>v==null||v===''?'—':String(v);
function formatDate(v){if(!v)return '—';const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v).slice(0,19);return new Intl.DateTimeFormat('ar-JO',{timeZone:'Asia/Amman',year:'numeric',month:'2-digit',day:'2-digit',hour:'numeric',minute:'2-digit',hour12:true}).format(d)}
function field(dl,k,v){const a=document.createElement('dt'),b=document.createElement('dd');a.textContent=k;b.textContent=value(v);dl.append(a,b)}
async function api(path,body){const res=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),cache:'no-store'});const d=await res.json();if(!res.ok)throw Error(d.error+(d.existing_order_code?' #'+d.existing_order_code:''));return d}
function draw(rows){list.replaceChildren();if(!rows.length){const p=document.createElement('p');p.className='card';p.textContent='ما في طلبات بانتظار الموافقة حاليًا.';list.append(p);return}
for(const o of rows){const card=document.createElement('article');card.className='card';const title=document.createElement('h3');title.textContent='طلب '+o.source_id;const dl=document.createElement('dl');
for(const [label,key] of [['تاريخ الطلب','source_created_at'],['العميل','name'],['الهاتف','phone'],['المنتج','product'],['اللون','color'],['المقاس','size'],['الوزن (كغ)','weight_kg'],['الكمية','quantity'],['الإجمالي','amount'],['المدينة','city'],['العنوان','address'],['ملاحظات','notes']])field(dl,label,key==='source_created_at'?formatDate(o[key]):o[key]);
const actions=document.createElement('div');actions.className='line';const store=document.createElement('select');const empty=document.createElement('option');empty.value='';empty.textContent='اختر المتجر';store.append(empty);for(const s of stores){const opt=document.createElement('option');opt.value=s.id;opt.textContent=s.name;store.append(opt)}
const approve=document.createElement('button');approve.className='approve';approve.textContent='موافقة وإدخال إلى كورفكس';const dismiss=document.createElement('button');dismiss.className='danger';dismiss.textContent='حذف من القائمة';const msg=document.createElement('small');
approve.onclick=async()=>{if(!store.value){msg.textContent='اختار المتجر أولًا';return}if(!confirm('هل توافق على إدخال هذا الطلب إلى كورفكس؟'))return;approve.disabled=dismiss.disabled=true;try{const d=await api('/api/litesale-queue',{action:'approve',source_id:o.source_id,store_id:Number(store.value)});msg.textContent='تم الإدخال بكود '+d.order_code;await load(false)}catch(e){msg.textContent='لم يتم الإدخال: '+e.message;approve.disabled=dismiss.disabled=false}};
dismiss.onclick=async()=>{if(!confirm('إخفاء هذا الطلب من قائمة الانتظار فقط؟ لن يُحذف من LiteSale.'))return;approve.disabled=dismiss.disabled=true;try{await api('/api/litesale-queue',{action:'dismiss',source_id:o.source_id});await load(false)}catch(e){msg.textContent=e.message;approve.disabled=dismiss.disabled=false}};
actions.append(store,approve,dismiss,msg);card.append(title,dl,actions);list.append(card)}
}
async function load(sync=true){if(busy)return;busy=true;refresh.disabled=true;error.textContent='';try{
if(!token)throw Error('افتح كورفكس وسجّل الدخول بحساب المدير أولًا.');
if(sync){
 status.textContent='جارٍ استقبال الطلبات الحديثة من LiteSale...';
 const preview=await api('/api/litesale-preview',{});const dateParts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Amman',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const parts=Object.fromEntries(dateParts.map(p=>[p.type,p.value]));const today=parts.year+'-'+parts.month+'-'+parts.day;
 const eligible=(preview.orders||[]).filter(o=>o.id&&(!o.created_at||String(o.created_at).slice(0,10)>=today));
 const staged=[];
 for(const o of eligible){try{const d=(await api('/api/litesale-order-detail',{id:String(o.id)})).detail;staged.push({source_id:String(o.id),name:o.name,phone:o.phone,product:d.product,color:d.color,size:d.size,weight_kg:d.weight_kg,quantity:d.quantity,amount:d.amount,address:d.address,city:d.city,notes:d.notes,status:o.status,source_created_at:o.created_at})}catch(e){error.textContent='بعض الطلبات تعذر قراءة تفاصيلها، ولن تُضاف قبل اكتمالها.'}}
 if(staged.length)await api('/api/litesale-queue',{action:'stage',orders:staged});
}
const q=await api('/api/litesale-queue');stores=q.stores||[];draw(q.orders||[]);status.textContent='طلبات بانتظار الموافقة: '+(q.orders||[]).length+'. لا يوجد إدخال تلقائي.';
}catch(e){error.textContent=e.message;status.textContent='تعذر التحديث.'}finally{busy=false;refresh.disabled=false}}
refresh.onclick=()=>load(true);load(true);setInterval(()=>{if(!document.hidden)load(true)},60000);
</script></body></html>
