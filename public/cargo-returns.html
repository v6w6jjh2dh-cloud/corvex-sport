<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مطابقة مرتجعات Cargo Box — كورفكس</title><style>body{font-family:system-ui;background:#f3f5fa;color:#182236;margin:0;padding:18px}main{max-width:1100px;margin:auto}.card{background:white;padding:20px;border-radius:14px;margin:12px 0}button{background:#2446ad;color:white;border:0;border-radius:9px;padding:12px;cursor:pointer}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%;background:white}td,th{border:1px solid #ddd;padding:9px;text-align:right}th{background:#e7ebf6}small{color:#666}.scroll{overflow:auto}</style></head><body><main><div class="card"><h2>مطابقة كشف مرتجعات Cargo Box مع جرد كورفكس</h2><p>ارفع ملف Excel الأصلي. تتم مطابقة الشحنات الملغية باستخدام الهاتف والمنطقة مع طلبات كورفكس، ثم استخراج الموديل والكمية. هذه معاينة آمنة ولا تعدّل رصيد الجرد أو حالة الطلب.</p><input id="file" type="file" accept=".xlsx,.xls"><button id="run">فحص الكشف</button><p id="msg"></p><a href="/">العودة إلى كورفكس</a></div><div class="card scroll" id="result"></div></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const $=id=>document.getElementById(id);const norm=s=>String(s??'').trim();const esc=s=>norm(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('run').onclick=async()=>{const file=$('file').files[0];if(!file)return $('msg').textContent='اختر ملف Excel أولًا';if(!window.XLSX)return $('msg').textContent='تعذر تحميل قارئ Excel، تحقق من الاتصال بالإنترنت';$('run').disabled=true;$('msg').textContent='جارٍ قراءة الكشف ومطابقة الطلبات...';try{const book=XLSX.read(await file.arrayBuffer(),{type:'array',raw:false});const sheet=book.Sheets[book.SheetNames[0]],data=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});const headerIndex=data.findIndex(row=>row.some(v=>norm(v)==='كود الشحنة')&&row.some(v=>norm(v)==='رقم الهاتف'));if(headerIndex<0)throw Error('لم أجد أعمدة Cargo Box المطلوبة');const headers=data[headerIndex].map(norm);const get=(r,k)=>r[headers.indexOf(k)];const rows=data.slice(headerIndex+1).filter(r=>norm(get(r,'كود الشحنة'))).map(r=>({shipment_code:get(r,'كود الشحنة'),phone:get(r,'رقم الهاتف'),area:get(r,'المنطقة'),city:get(r,'المدينة'),status:get(r,'حالة الشحنة'),return_status:get(r,'حالة الإرجاع')}));const response=await fetch('/api/cargo-returns-preview',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+localStorage.getItem('corvex_token')},body:JSON.stringify({rows})});const d=await response.json();if(!response.ok)throw Error(d.error||'فشل الفحص');$('msg').textContent='تم فحص '+d.summary.total+' شحنة — مطابق: '+d.summary.matched+' — بحاجة مراجعة: '+d.summary.review+'. لم يتم تعديل الجرد.';$('result').innerHTML='<table><thead><tr><th>كود الشحنة</th><th>الهاتف</th><th>المنطقة</th><th>نتيجة المطابقة</th><th>طلب كورفكس</th><th>الموديل والكمية</th><th>إرسال المرتجع</th><th>ملاحظة</th></tr></thead><tbody>'+d.rows.map(r=>'<tr><td>'+esc(r.shipment_code)+'</td><td>'+esc(r.phone)+'</td><td>'+esc(r.area)+'</td><td>'+esc(({matched:'مطابق',unmatched:'غير مطابق',ambiguous:'عدة طلبات',review_model:'راجع الموديل',ignored:'غير ملغي',invalid:'بيانات ناقصة'})[r.status]||r.status)+'</td><td>'+esc(r.order_code||((r.candidate_codes||[]).join(', ')))+'</td><td>'+esc((r.items||[]).map(i=>i.model_name+' × '+i.quantity).join('، '))+'</td><td>'+esc(r.return_status)+'</td><td>'+esc(r.reason)+'</td></tr>').join('')+'</tbody></table>'}catch(e){$('msg').textContent='تعذر الفحص: '+e.message}finally{$('run').disabled=false}};
</script></body></html>
